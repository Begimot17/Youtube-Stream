<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikita: FM - Live Stream Control Deck</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #0d1117;
            background-image: radial-gradient(circle at 1px 1px, #21262d 1px, transparent 0);
            background-size: 20px 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .list-group-item {
            cursor: grab;
            background-color: rgba(22, 27, 34, 0.75);
            border-color: rgba(255, 255, 255, 0.1);
            transition: background-color 0.2s ease-in-out;
            backdrop-filter: blur(5px);
        }
        .list-group-item:hover {
             background-color: rgba(33, 38, 45, 0.9);
        }
        .list-group-item:active {
            cursor: grabbing;
        }
        #now-playing-progress {
            transition: width 0.3s linear;
        }
        .btn-group .btn, #shuffle-button {
            transition: all 0.2s ease-in-out;
        }
        .card, .list-group {
             border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="container my-4 my-md-5">
        <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom" style="border-color: rgba(255,255,255,0.1) !important;">
            <h1 class="mb-0 fs-3">Nikita: FM - Control Deck</h1>
            <div class="d-flex gap-2">
                <a href="https://www.youtube.com/@Begimot17/live" target="_blank" rel="noopener noreferrer" class="btn btn-danger d-flex align-items-center">
                    <i class="bi bi-youtube me-2"></i>
                    <span>Live</span>
                </a>
                <button id="shuffle-button" class="btn btn-outline-secondary"><i class="bi bi-shuffle me-1"></i>Shuffle</button>
            </div>
        </header>

        <main>
            <section id="now-playing-container" class="mb-4" style="display: none;">
                <h5 class="text-white-50 mb-2 small text-uppercase">Now Playing</h5>
                <div id="now-playing-card" class="card shadow-sm">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span id="now-playing-name" class="fw-bold fs-5"></span>
                            <span id="now-playing-time" class="text-white-50"></span>
                        </div>
                        <div class="progress" role="progressbar" aria-label="Song progress" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" style="height: 6px;">
                            <div id="now-playing-progress" class="progress-bar bg-success" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </section>

            <section>
                <h5 class="text-white-50 mb-2 small text-uppercase">Up Next</h5>
                <ul id="song-list" class="list-group shadow-sm">
                    <!-- Songs will be populated here by JavaScript -->
                </ul>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
